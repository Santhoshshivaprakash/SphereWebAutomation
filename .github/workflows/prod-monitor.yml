name: Synthetic Monitor (prod + staging)

# Runs a tiny login + authenticated-page smoke against PRODUCTION and STAGING on a schedule.
# On failure, the email reporter sends an alert via SMTP. If the job itself breaks
# before the reporter runs (e.g. npm ci fails), GitHub's built-in workflow-failure
# email notification covers it.
on:
  schedule:
    - cron: '30 3,9,15 * * *' # 3× a day: 09:00, 15:00, 21:00 IST (03:30/09:30/15:30 UTC; GitHub may delay a few min)
  workflow_dispatch: {}      # allow manual runs from the Actions tab

concurrency:
  group: prod-monitor
  cancel-in-progress: true

jobs:
  # Runs once per environment (matrix), on separate machines at the same time.
  # Each environment signs in with its own account, picked by secret NAME:
  #   production → TEST_USER_EMAIL / TEST_USER_PASSWORD
  #   staging    → STAGING_EMAIL   / STAGING_PASSWORD
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false   # a failure on one environment doesn't cancel the other
      matrix:
        include:
          - env: production
            url: https://sphere.aastrika.org
            email_secret: TEST_USER_EMAIL
            password_secret: TEST_USER_PASSWORD
          - env: staging
            url: https://portal-staging.aastrika.org
            email_secret: STAGING_EMAIL
            password_secret: STAGING_PASSWORD
    name: monitor (${{ matrix.env }})
    env:
      BASE_URL: ${{ matrix.url }}
      HEADLESS: 'true'   # GitHub machines have no screen
      MONITOR_EMAIL: ${{ secrets[matrix.email_secret] }}
      MONITOR_PASSWORD: ${{ secrets[matrix.password_secret] }}
      # SMTP alerting (used by reporters/email-reporter.ts)
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run synthetic monitor
        run: npm run test:monitor

      # The runner is deleted after the job, so anything not uploaded here is lost.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-report-${{ matrix.env }}-${{ github.run_number }}
          path: |
            test-reports/run-reports/
            brand-reports/
            playwright-report/
          retention-days: 90
