name: regression

# Runs the full regression suite AFTER EVERY RELEASE (and on demand).
on:
  release:
    types: [published]     # fires whenever a GitHub Release is published
  workflow_dispatch: {}     # manual "Run workflow" button
  # schedule:
  #   - cron: '0 2 * * 1'   # optional: also run weekly (Mon 02:00 UTC)

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run full regression (production)
        run: npm run test:regression
        env:
          BASE_URL: https://sphere.aastrika.org
          STAGING_URL: https://sphere.aastrika.org
          HEADLESS: 'true'
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Email the report on failure (optional — set these secrets to enable)
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-reports-${{ github.run_number }}
          path: |
            brand-reports/
            playwright-report/
            test-reports/
          retention-days: 30
