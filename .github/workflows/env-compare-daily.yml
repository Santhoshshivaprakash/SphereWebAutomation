name: Daily Prod vs Staging Compare

# Once a day, opens every PUBLIC page in config/compare-routes.json on
# production and staging side by side (scripts/compare-env.mjs, no --auth) and
# publishes the reports. Differences are REPORTED, not treated as a failure:
# the job only goes red when the comparison itself could not run. The
# plain-English report is shown on the run's Summary page; full HTML/PDF/JSON
# reports and screenshots are in the uploaded artifact.
#
# ENVIRONMENTS: scheduled runs test production + staging. The "Run workflow"
# button offers a choice — "uat only" or all three — so UAT (uat.aastrika.org,
# its own backend) can be run on demand. Each job turns the choice into its
# matrix with fromJSON; on a scheduled run there is no input, so the default
# (production + staging) applies.
on:
  schedule:
    - cron: '30 3 * * *' # 03:30 UTC = 09:00 IST, daily (GitHub may delay a few min)
  workflow_dispatch:      # allow manual runs from the Actions tab
    inputs:
      environments:
        description: 'Environments to test'
        type: choice
        default: production + staging
        options:
          - production + staging
          - uat only
          - production + staging + uat

concurrency:
  group: env-compare-daily
  cancel-in-progress: true

jobs:
  # Production is always the baseline; the matrix picks what it's compared with.
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.environments == 'uat only' && '["uat"]' || inputs.environments == 'production + staging + uat' && '["staging","uat"]' || '["staging"]') }}
    name: compare (production vs ${{ matrix.target }})
    env:
      TARGET_URL: ${{ matrix.target == 'uat' && 'https://uat.aastrika.org' || 'https://portal-staging.aastrika.org' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # compare-env.mjs exits 1 when it finds BLOCKING differences as well as
      # when it crashes, so the exit code alone can't tell them apart. The JSON
      # report is written only after a complete run, so its presence is the
      # real "did the comparison run" signal.
      - name: Compare public pages (production vs ${{ matrix.target }})
        id: compare
        run: |
          set +e
          node scripts/compare-env.mjs \
            --a https://sphere.aastrika.org \
            --b "$TARGET_URL"
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          if ! ls compare-reports/compare_production_vs_*.json >/dev/null 2>&1; then
            echo "::error::Comparison did not complete — no JSON report was written."
            exit 1
          fi

      - name: Write summary
        if: always()
        run: |
          txt=$(ls -t compare-reports/*_SIMPLE.txt 2>/dev/null | head -1)
          {
            echo "## Production vs ${{ matrix.target }} — public pages"
            if [ "${{ steps.compare.outputs.exit }}" = "1" ]; then
              echo "⚠️ Blocking differences found — see the report below."
            elif [ "${{ steps.compare.outputs.exit }}" = "0" ]; then
              echo "✅ No blocking differences."
            fi
            echo
            echo "Full HTML/PDF reports and screenshots: **env-compare-report-${{ matrix.target }}-${{ github.run_number }}** artifact."
            if [ -n "$txt" ]; then
              echo
              echo '```'
              cat "$txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: env-compare-report-${{ matrix.target }}-${{ github.run_number }}
          path: |
            compare-reports/compare_production_vs_*
          retention-days: 90

  # The UI + API suite on BOTH environments: the matrix runs this job twice, once
  # per BASE_URL, on separate machines at the same time. Each environment signs
  # in with its own account (production and staging are separate backends),
  # picked by secret NAME:
  #   production → TEST_USER_EMAIL / TEST_USER_PASSWORD
  #   staging    → STAGING_EMAIL   / STAGING_PASSWORD
  daily-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false   # a failure on one environment doesn't cancel the other
      matrix:
        env: ${{ fromJSON(inputs.environments == 'uat only' && '["uat"]' || inputs.environments == 'production + staging + uat' && '["production","staging","uat"]' || '["production","staging"]') }}
    name: daily-tests (${{ matrix.env }})
    env:
      # production → sphere + TEST_USER_*, staging → portal-staging + STAGING_*,
      # uat → uat.aastrika.org + UAT_* (each backend has its own accounts).
      BASE_URL: ${{ matrix.env == 'production' && 'https://sphere.aastrika.org' || matrix.env == 'staging' && 'https://portal-staging.aastrika.org' || 'https://uat.aastrika.org' }}
      HEADLESS: 'true'
      SKIP_SIGNUP: '1'   # signup runs in daily-signup; keep it out of this suite
      JSON_OUT: test-reports/results.json   # machine-readable results for daily-report
      TEST_USER_EMAIL: ${{ secrets[matrix.env == 'production' && 'TEST_USER_EMAIL' || matrix.env == 'staging' && 'STAGING_EMAIL' || 'UAT_EMAIL'] }}
      TEST_USER_PASSWORD: ${{ secrets[matrix.env == 'production' && 'TEST_USER_PASSWORD' || matrix.env == 'staging' && 'STAGING_PASSWORD' || 'UAT_PASSWORD'] }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run UI + API tests
        run: >
          npx playwright test
          tests/PublicPage.spec.ts tests/public-login.spec.ts
          tests/Account.spec.ts tests/Mycourse.spec.ts
          tests/CourseTOC.spec.ts tests/Competency.spec.ts
          tests/api/
          --project=Chrome --project=api
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-test-reports-${{ matrix.env }}-${{ github.run_number }}
          path: |
            brand-reports/
            playwright-report/
            test-reports/
          retention-days: 90

  # Signup on BOTH environments: the matrix runs this job twice, once per
  # BASE_URL, on separate machines at the same time. Staging accounts are named
  # "stage-testauto…@yopmail.com", production ones "testauto…@yopmail.com".
  daily-signup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false   # a failure on one environment doesn't cancel the other
      matrix:
        env: ${{ fromJSON(inputs.environments == 'uat only' && '["uat"]' || inputs.environments == 'production + staging + uat' && '["production","staging","uat"]' || '["production","staging"]') }}
    name: daily-signup (${{ matrix.env }})
    env:
      BASE_URL: ${{ matrix.env == 'production' && 'https://sphere.aastrika.org' || matrix.env == 'staging' && 'https://portal-staging.aastrika.org' || 'https://uat.aastrika.org' }}
      HEADLESS: 'true'
      JSON_OUT: test-reports/results.json   # machine-readable results for daily-report
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Create account on ${{ matrix.env }}
        run: npx playwright test tests/create-account.spec.ts --project=Chrome
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-signup-${{ matrix.env }}-${{ github.run_number }}
          path: |
            brand-reports/
            playwright-report/
            test-reports/
            .last-registered-email.json
            generated-emails.txt
          retention-days: 90

  # ONE report for the whole run, emailed when everything has finished.
  # Waits for every job (even failed ones), downloads all their artifacts, and
  # builds daily-summary.html: compare, test results for both environments with
  # every failure and its reason, and the accounts created. It is emailed (with
  # the compare PDF attached) when the SMTP secrets are set, shown on the run's
  # Summary page, and uploaded as the daily-summary-<N> artifact.
  # Only this job gets the SMTP secrets, so each run sends exactly one email.
  daily-report:
    needs: [compare, daily-tests, daily-signup]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci   # nodemailer, for the email

      - name: Download every job's reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports
          pattern: '*-${{ github.run_number }}'

      - name: Build the report and email it
        env:
          JOBS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >
          node scripts/daily-summary.mjs
          --dir all-reports
          --out daily-summary
          --run-number ${{ github.run_number }}
          --run-url "$RUN_URL"
          --jobs "$JOBS"

      - name: Show it on the run's Summary page
        if: always()
        run: cat daily-summary/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-summary-${{ github.run_number }}
          path: daily-summary/
          retention-days: 90
