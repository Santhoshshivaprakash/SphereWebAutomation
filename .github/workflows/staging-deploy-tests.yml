name: Staging Deploy Tests

# Runs the automation against STAGING whenever staging is deployed, and publishes
# the branded report as an artifact.
#
# Trigger it from the staging deploy pipeline with one HTTP call at the end of a
# successful deploy (see docs/CI-ON-DEPLOY.md):
#
#   curl -X POST \
#     -H "Authorization: token $GH_PAT" \
#     -H "Accept: application/vnd.github+json" \
#     https://api.github.com/repos/Santhoshshivaprakash/SphereWebAutomation/dispatches \
#     -d '{"event_type":"staging-deployed"}'
#
# …or press "Run workflow" on the Actions tab.
on:
  repository_dispatch:
    types: [staging-deployed]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Portal to test (leave as-is for staging)'
        required: false
        default: 'https://portal-staging.aastrika.org'
      run_authenticated:
        description: 'Also run the signed-in suite'
        required: false
        type: boolean
        default: true

# One staging run at a time. Deploys often land in bursts, and two runs sharing
# the same test account trip over each other's session.
concurrency:
  group: staging-deploy-tests
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # NOTE: do NOT use the npm `report:*` scripts here — they hard-pin
      # BASE_URL to production, so they would silently test prod from a
      # staging workflow. The steps below invoke playwright directly.
      BASE_URL: ${{ github.event.inputs.base_url || 'https://portal-staging.aastrika.org' }}
      HEADLESS: 'true'
      # The signed-in specs authenticate once via tests/helpers/authedTest.ts.
      # A staging-specific account is used when one is configured; otherwise the
      # standard test account, which works on both backends.
      TEST_USER_EMAIL: ${{ secrets.STAGING_TEST_USER_EMAIL || secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.STAGING_TEST_USER_PASSWORD || secrets.TEST_USER_PASSWORD }}
      # Emailed alert on failure (optional — skipped when unset).
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Show what is being tested
        run: echo "Testing $BASE_URL as ${TEST_USER_EMAIL:-'(no account configured)'}"

      # Public pages need no account, so these run even when no secret is set.
      - name: Public site + login page
        run: npx playwright test tests/PublicPage.spec.ts tests/public-login.spec.ts --project=Chrome

      # Fail fast, and say WHICH account is unusable. Without this a bad secret
      # shows up as every signed-in test failing at once, with the real reason
      # buried in the first fixture error. Non-interactive by design: it asks
      # nothing and exits 1 when no account can sign in.
      - name: Check the credentials before running the signed-in suite
        if: ${{ env.TEST_USER_EMAIL != '' }}
        run: npm run check:login

      # Signed-in suite. The fixture tries the last signed-up session first and
      # falls back to the account in the secrets, naming whichever it uses.
      - name: Signed-in suite
        if: ${{ env.TEST_USER_EMAIL != '' && github.event.inputs.run_authenticated != 'false' }}
        run: npx playwright test tests/Account.spec.ts tests/Mycourse.spec.ts tests/CourseTOC.spec.ts tests/PrivatePage.spec.ts --project=Chrome

      # Signup — registers a new "stage-…" yopmail user. Kept LAST on purpose:
      # create-account saves the new user's session and the signed-in fixture
      # prefers it, so running it earlier would switch the signed-in suite to a
      # brand-new account with no courses. Runs even if earlier steps failed.
      - name: Create account (signup)
        if: ${{ !cancelled() }}
        run: npx playwright test tests/create-account.spec.ts --project=Chrome

      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sphere-staging-report
          path: |
            brand-reports/
            test-reports/
            playwright-report/
          retention-days: 90

  # The full journey of ONE brand-new user, every run: sign up → My Courses →
  # course completion → competency → Account → Course TOC → private pages →
  # role check. A fixed account would have the course and competency finished
  # after the first run, leaving nothing to test.
  # positiveflow signs up AND completes onboarding (profile), then saves the
  # session (.auth/fresh-user.json); USE_FRESH_USER=1 makes every later spec use it.
  # Runs on its own machine, in parallel with the `test` job above.
  new-user-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'https://portal-staging.aastrika.org' }}
      HEADLESS: 'true'
      USE_FRESH_USER: '1'
      COURSE_NAME: Developmental Psychology
      COMPETENCY_NAME: Normal delivery
      PROFILE_DESIGNATION: ANM/MPW   # Normal delivery is an ANM/MPW competency
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # quiz-answer fallback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Signup has intermittent failures (slow city list, Terms page served in the
      # wrong language), so retry up to 3 times, each with a brand-new user.
      - name: Sign up + onboard a new user
        id: signup
        run: |
          for attempt in 1 2 3; do
            echo "::group::Signup attempt $attempt"
            npx playwright test tests/positiveflow.spec.ts --project=Chrome && { echo "::endgroup::"; exit 0; }
            echo "::endgroup::"
          done
          echo "::error::Signup failed 3 times"; exit 1

      # Every step below runs as THAT new user (USE_FRESH_USER=1), in this order:
      #   My Courses → course completion → competency → Account → Course TOC →
      #   private pages → role check. Each is skipped only if signup failed, and
      #   still runs when an earlier step fails, so one failure doesn't hide the rest.
      - name: My Courses
        if: ${{ !cancelled() && steps.signup.outcome == 'success' }}
        run: npx playwright test tests/Mycourse.spec.ts --project=Chrome

      - name: Complete course — ${{ env.COURSE_NAME }}
        if: ${{ !cancelled() && steps.signup.outcome == 'success' }}
        run: npx playwright test tests/CourseComplete.spec.ts --project=Chrome

      - name: Complete competency — ${{ env.COMPETENCY_NAME }}
        if: ${{ !cancelled() && steps.signup.outcome == 'success' }}
        run: npx playwright test tests/CompleteCompetency.spec.ts --project=Chrome

      - name: Account
        if: ${{ !cancelled() && steps.signup.outcome == 'success' }}
        run: npx playwright test tests/Account.spec.ts --project=Chrome

      - name: Course TOC
        if: ${{ !cancelled() && steps.signup.outcome == 'success' }}
        run: npx playwright test tests/CourseTOC.spec.ts --project=Chrome

      - name: Private (signed-in) pages
        if: ${{ !cancelled() && steps.signup.outcome == 'success' }}
        run: npx playwright test tests/PrivatePage.spec.ts --project=Chrome

      # LAST: switches the user through every designation (Account → Organization
      # Details) and checks the courses offered follow the role. It changes the
      # user's role, so nothing that depends on ANM/MPW may run after it; it
      # restores ANM/MPW when done.
      - name: Courses follow the role (every designation)
        if: ${{ !cancelled() && steps.signup.outcome == 'success' }}
        run: npx playwright test tests/RoleCourses.spec.ts --project=Chrome

      - name: Upload reports + certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-user-journey-staging-report
          path: |
            brand-reports/
            test-reports/
            playwright-report/
          retention-days: 90
